<text x="1610.00" y="1560.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Show validation, password mismatch, duplicate-username and invalid-credentials errors. Preserve safe entered values after failure.</text>
<text x="1610.00" y="1588.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Username and role are read-only. Session expiry returns to sign in; sign-out clears the local token.</text>
