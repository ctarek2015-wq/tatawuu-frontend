<text x="90.00" y="1560.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Volunteer signup leads to discovery; organizer signup leads to organization setup. A single sign-in form routes users by their saved role.</text>
<text x="90.00" y="1588.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Admin accounts are provisioned separately; there is no admin key.</text>
