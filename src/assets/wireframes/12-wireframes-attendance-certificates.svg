<text x="2220.00" y="363.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">After the activity ends, mark every active registration Attended or</text>
<text x="2220.00" y="395.20" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Absent.</text>
<text x="2220.00" y="427.40" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b"></text>
<text x="2220.00" y="459.60" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Mark campaign completed stays disabled while any attendance is</text>
<text x="2220.00" y="491.80" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Unmarked.</text>
<text x="2220.00" y="524.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b"></text>
<text x="2220.00" y="556.20" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Cancelled registrations appear separately and cannot receive</text>
<text x="2220.00" y="588.40" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">attendance or certificates.</text>
<rect x="2200" y="785" width="830" height="293.4" rx="7" fill="#f1f5f6" stroke="#c4cfd4" stroke-width="1"/>
<text x="2220.00" y="826.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#17242b">CERTIFICATE ACTION STATES</text>
<text x="2220.00" y="868.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Not granted → Grant certificate</text>
<text x="2220.00" y="900.20" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Processing → Generating…</text>
<text x="2220.00" y="932.40" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Failed → Retry</text>
<text x="2220.00" y="964.60" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Issued → Granted</text>
<text x="2220.00" y="996.80" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b"></text>
<text x="2220.00" y="1029.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">Only attendees in completed campaigns qualify. Attendance locks</text>
<text x="2220.00" y="1061.20" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#52636b">while a certificate is processing or issued.</text>
<rect x="70" y="1360" width="1440" height="124.0" rx="7" fill="#f1f5f6" stroke="#c4cfd4" stroke-width="1"/>
<text x="90.00" y="1401.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#17242b">FLOW &amp; ACCESS</text>
<text x="90.00" y="1440.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">The owning organizer records attendance after the end, completes the campaign, then chooses which attendees receive a certificate.</text>
<text x="90.00" y="1468.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Certificate issuance is optional.</text>
<rect x="1590" y="1360" width="1440" height="124.0" rx="7" fill="#f1f5f6" stroke="#c4cfd4" stroke-width="1"/>
<text x="1610.00" y="1401.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#17242b">IMPORTANT STATES</text>
<text x="1610.00" y="1440.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Repeated grants return the same certificate. Failed generation can be retried. Certificate number, PDF content and recipient must stay</text>
<text x="1610.00" y="1468.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">consistent.</text>
