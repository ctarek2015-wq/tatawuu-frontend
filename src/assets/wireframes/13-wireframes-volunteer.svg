<text x="1610.00" y="1460.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Only issued certificates appear. The page fetches PDF bytes with the Bearer token, then uses a temporary blob URL for preview/download.</text>
<text x="1610.00" y="1488.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52636b">Revoke the URL after use. Show loading, fetch failure, session expiry and empty states.</text>
