<text x="1470.00" y="365.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">The Filters button opens a panel containing governorate, area, category, from date and to date. Apply filters updates the</text>
<text x="1470.00" y="400.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">campaign list; Clear resets them. The search input remains visible.</text>
<rect x="1450" y="625" width="1580" height="173.0" rx="7" fill="#f1f5f6" stroke="#c4cfd4" stroke-width="1"/>
<text x="1470.00" y="666.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#17242b">MOBILE NAVIGATION</text>
<text x="1470.00" y="710.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">The menu links to Explore / Search, Favorites, My activities, Certificates, Profile and Sign out for volunteers. Organizers</text>
<text x="1470.00" y="745.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">get My campaigns and My organization; attendance opens from a campaign. Admins get Moderation with Organizations</text>
<text x="1470.00" y="780.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">and Campaigns tabs.</text>
<rect x="1450" y="1000" width="1580" height="173.0" rx="7" fill="#f1f5f6" stroke="#c4cfd4" stroke-width="1"/>
<text x="1470.00" y="1041.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#17242b">RESPONSIVE &amp; SHARED STATES</text>
<text x="1470.00" y="1085.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">Stack forms and cards; convert tables into labeled cards. Hide optional Call/WhatsApp links when no number is provided.</text>
<text x="1470.00" y="1120.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">Every screen handles loading, empty and request-failure states. Show validation and upload/save progress. Display all</text>
<text x="1470.00" y="1155.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#52636b">times in Bahrain time.</text>
<text x="150.00" y="1519.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#60717a">All sample names, dates, addresses and certificate numbers in sheets 08–15 are illustrative design content.</text>
<text x="150.00" y="1563.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#60717a">These are low-fidelity wireframes: rectangles represent images, and labeled controls show intended behavior.</text>
