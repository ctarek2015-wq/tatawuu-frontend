<text x="75.00" y="1248.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#bdcbd4">Issue: 201 when first issued; 200 when already issued; 202 while processing. Failed generation is not an issued certificate.</text>
<text x="75.00" y="1287.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#bdcbd4">Recipient = volunteer awarded the certificate. PDF endpoints return bytes, not JSON; private/no-store caching.</text>
<text x="75.00" y="1326.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#bdcbd4">Admin decisions require the current revision. Rejection/removal requires a reason. Approval accepts approved or rejected.</text>
<text x="75.00" y="1365.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#bdcbd4">Certificate PDFs use authenticated Cloudinary storage. Express checks the recipient and streams the file; no public PDF URLs.</text>
