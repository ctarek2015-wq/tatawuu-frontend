<text x="75.00" y="1287.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#bdcbd4">JWT is returned at sign-in and sent as Authorization: Bearer &lt;token&gt;. Client-side sign-out clears the token; one-hour expiry is planned.</text>
<text x="75.00" y="1326.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#bdcbd4">Organization saves accept multipart data + optional image; removeImage removes a logo. Edits return the profile to pending review.</text>
